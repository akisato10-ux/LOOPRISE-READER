<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ループライズ・リーダー</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15171c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LoopriseReader">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --asphalt:#15171c;
    --asphalt-2:#1d2028;
    --line:#2a2e38;
    --headlight:#ffb84d;
    --headlight-dim:#7a5a2c;
    --taillight:#ff5d5d;
    --mint:#5ad1a8;
    --text:#f1efe9;
    --text-dim:#8e93a1;
    --font-display: 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    --font-body: 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,184,77,0.08), transparent 60%),
      var(--asphalt);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px;}

  .install-banner{
    display:none;align-items:center;justify-content:space-between;gap:12px;
    background:linear-gradient(90deg, rgba(255,184,77,0.12), rgba(255,93,93,0.08));
    border:1px solid var(--headlight-dim);border-radius:10px;
    padding:10px 14px;margin-bottom:18px;font-size:13px;color:var(--text);
  }
  .install-banner.show{display:flex;}
  .install-banner button{
    background:var(--headlight);color:#1a1306;border:none;border-radius:6px;
    padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;flex:none;
  }

  /* ---- Header / dashboard strip ---- */
  header{
    display:flex;align-items:baseline;justify-content:space-between;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;margin-bottom:22px;
  }
  .brand{
    font-family:var(--font-display);
    font-weight:800;
    font-size:22px;
    letter-spacing:0.5px;
  }
  .brand span{color:var(--headlight);}
  .odometer{
    font-variant-numeric: tabular-nums;
    font-size:12px;color:var(--text-dim);
    letter-spacing:1px;text-transform:uppercase;
  }

  /* ---- Dial (signature element) ---- */
  .dial-stage{
    display:flex;flex-direction:column;align-items:center;
    padding:18px 0 8px;
  }
  .dial{
    position:relative;width:230px;height:230px;border-radius:50%;
    background: radial-gradient(circle at 50% 38%, #23262f, #181a20 72%);
    border:1px solid var(--line);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02), 0 30px 60px -25px rgba(0,0,0,0.7);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .dial:active{transform:scale(0.98);}
  .dial-ring{
    position:absolute;inset:0;border-radius:50%;
  }
  .dial-progress{
    transform:rotate(-90deg);
    transform-origin:50% 50%;
  }
  .dial-center{
    position:relative;z-index:2;
    display:flex;flex-direction:column;align-items:center;gap:6px;
  }
  .dial-icon{width:46px;height:46px;}
  .dial-label{
    font-family:var(--font-display);
    font-size:11px;letter-spacing:2px;text-transform:uppercase;
    color:var(--text-dim);
  }
  .dial-status{
    margin-top:14px;font-size:14px;color:var(--text-dim);
    min-height:20px;text-align:center;
  }
  .dial-status.live{color:var(--mint);}

  /* ---- Controls row ---- */
  .controls{
    display:flex;align-items:center;justify-content:center;gap:18px;
    margin-top:18px;
  }
  .ctrl-btn{
    width:56px;height:56px;border-radius:50%;
    background:var(--asphalt-2);border:1px solid var(--line);
    color:var(--text);display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:border-color .15s, background .15s;
  }
  .ctrl-btn:hover{border-color:var(--headlight-dim);}
  .ctrl-btn:active{background:#262a34;}
  .ctrl-btn svg{width:22px;height:22px;}

  /* ---- Speed (rate) slider ---- */
  .speed-row{
    margin-top:26px;
    display:flex;align-items:center;gap:14px;
  }
  .speed-row label{font-size:12px;color:var(--text-dim);min-width:70px;letter-spacing:1px;text-transform:uppercase;}
  input[type=range]{
    -webkit-appearance:none;flex:1;height:4px;border-radius:2px;
    background:linear-gradient(90deg, var(--headlight) var(--fill,50%), var(--line) var(--fill,50%));
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
    background:var(--headlight);border:3px solid var(--asphalt);
    box-shadow:0 0 0 1px var(--headlight);
    cursor:pointer;
  }
  .speed-val{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text);min-width:38px;text-align:right;}

  /* ---- Input section ---- */
  .panel{
    margin-top:34px;background:var(--asphalt-2);border:1px solid var(--line);
    border-radius:14px;padding:20px;
  }
  .panel h2{
    font-family:var(--font-display);font-size:13px;letter-spacing:2px;
    text-transform:uppercase;color:var(--text-dim);margin:0 0 14px;
    display:flex;align-items:center;gap:8px;
  }
  .panel h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--headlight);}

  .dropzone{
    border:1.5px dashed var(--line);border-radius:10px;
    padding:26px 16px;text-align:center;cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  .dropzone:hover, .dropzone.drag{border-color:var(--headlight);background:rgba(255,184,77,0.05);}
  .dropzone svg{width:30px;height:30px;color:var(--text-dim);margin-bottom:8px;}
  .dropzone .main{font-size:14px;color:var(--text);}
  .dropzone .sub{font-size:12px;color:var(--text-dim);margin-top:4px;}
  input[type=file]{display:none;}

  .filename-chip{
    margin-top:12px;display:none;align-items:center;gap:8px;
    background:var(--asphalt);border:1px solid var(--line);
    border-radius:8px;padding:8px 12px;font-size:13px;color:var(--mint);
  }
  .filename-chip.show{display:flex;}
  .filename-chip button{
    margin-left:auto;background:none;border:none;color:var(--text-dim);
    cursor:pointer;font-size:13px;
  }

  textarea{
    width:100%;min-height:140px;margin-top:14px;
    background:var(--asphalt);border:1px solid var(--line);border-radius:10px;
    color:var(--text);font-size:15px;line-height:1.6;padding:14px;
    font-family:var(--font-body);resize:vertical;
  }
  textarea:focus{outline:none;border-color:var(--headlight-dim);}
  textarea::placeholder{color:var(--text-dim);}

  .voice-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;align-items:center;}
  .voice-hint{font-size:11px;color:var(--text-dim);margin-top:8px;line-height:1.5;}
  .voice-hint .tag{color:var(--mint);}
  select{
    flex:1;min-width:160px;background:var(--asphalt);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:13px;
  }

  .progress-track{
    margin-top:18px;height:4px;background:var(--line);border-radius:2px;overflow:hidden;
  }
  .progress-fill{
    height:100%;width:0%;background:linear-gradient(90deg, var(--headlight), var(--taillight));
    transition:width .2s linear;
  }
  .progress-text{font-size:11px;color:var(--text-dim);margin-top:6px;text-align:right;}

  footer{margin-top:40px;text-align:center;color:var(--text-dim);font-size:11px;letter-spacing:1px;}
  footer span{color:var(--headlight);}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="install-banner" id="installBanner">
    <span>ホーム画面に追加すると、アプリのように起動できます</span>
    <button id="installBtn">追加する</button>
  </div>

  <header>
    <div class="brand">LOOP<span>RISE</span> READER</div>
    <div class="odometer" id="wordCount">0 文字</div>
  </header>

  <div class="dial-stage">
    <div class="dial" id="dialBtn" role="button" tabindex="0" aria-label="再生・一時停止">
      <svg class="dial-ring" width="230" height="230">
        <circle cx="115" cy="115" r="104" fill="none" stroke="#262a34" stroke-width="3"/>
        <circle class="dial-progress" id="dialProgress" cx="115" cy="115" r="104" fill="none"
                stroke="url(#grad)" stroke-width="3" stroke-linecap="round"
                stroke-dasharray="653.5" stroke-dashoffset="653.5"/>
        <defs>
          <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffb84d"/>
            <stop offset="100%" stop-color="#ff5d5d"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="dial-center">
        <svg class="dial-icon" id="playIcon" viewBox="0 0 24 24" fill="none">
          <path d="M8 5v14l11-7L8 5z" fill="#ffb84d"/>
        </svg>
        <div class="dial-label">タップして再生</div>
      </div>
    </div>
    <div class="dial-status" id="statusText">資料を読み込んでください</div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="backBtn" aria-label="10秒戻す">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 4v6h6"/></svg>
    </button>
    <button class="ctrl-btn" id="stopBtn" aria-label="停止">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
    </button>
    <button class="ctrl-btn" id="fwdBtn" aria-label="10秒送る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M21 4v6h-6"/></svg>
    </button>
  </div>

  <div class="speed-row">
    <label for="rateSlider">速さ</label>
    <input type="range" id="rateSlider" min="0.5" max="2" step="0.1" value="1" style="--fill:33%">
    <div class="speed-val" id="rateVal">1.0×</div>
  </div>

  <div class="panel">
    <h2>資料を読み込む</h2>
    <div class="dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <div class="main">Word・PDF・テキストをドラッグ、またはタップして選択</div>
      <div class="sub">.docx / .pdf / .txt 対応</div>
    </div>
    <input type="file" id="fileInput" accept=".docx,.pdf,.txt">
    <div class="filename-chip" id="fileChip">
      <span id="fileChipName"></span>
      <button id="fileChipClear">削除</button>
    </div>

    <textarea id="textInput" placeholder="ここに直接文章を貼り付けることもできます…"></textarea>

    <div class="voice-row">
      <select id="voiceSelect"></select>
      <button class="ctrl-btn" id="previewBtn" aria-label="この声を試聴" style="width:44px;height:44px;flex:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
    </div>
    <div class="voice-hint" id="voiceHint"></div>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">0 / 0</div>
  </div>

  <footer>運転中はタップ操作のみでご利用ください。<span>LOOPRISE</span> SYSTEMS</footer>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const textInput = document.getElementById('textInput');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileChip = document.getElementById('fileChip');
const fileChipName = document.getElementById('fileChipName');
const fileChipClear = document.getElementById('fileChipClear');
const wordCount = document.getElementById('wordCount');
const dialBtn = document.getElementById('dialBtn');
const dialProgress = document.getElementById('dialProgress');
const playIcon = document.getElementById('playIcon');
const statusText = document.getElementById('statusText');
const rateSlider = document.getElementById('rateSlider');
const rateVal = document.getElementById('rateVal');
const voiceSelect = document.getElementById('voiceSelect');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const stopBtn = document.getElementById('stopBtn');
const backBtn = document.getElementById('backBtn');
const fwdBtn = document.getElementById('fwdBtn');
const voiceHint = document.getElementById('voiceHint');
const previewBtn = document.getElementById('previewBtn');
const installBanner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');

const CIRC = 2 * Math.PI * 104;
let sentences = [];
let currentIndex = 0;
let isPlaying = false;
let voices = [];

function updateWordCount(){
  const n = textInput.value.length;
  wordCount.textContent = n.toLocaleString('ja-JP') + ' 文字';
}
textInput.addEventListener('input', updateWordCount);
updateWordCount();

// ---------- File handling ----------
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if(fileInput.files.length) handleFile(fileInput.files[0]);
});
fileChipClear.addEventListener('click', () => {
  fileChip.classList.remove('show');
  textInput.value = '';
  updateWordCount();
  fileInput.value = '';
});

async function handleFile(file){
  statusText.textContent = '読み込み中…';
  fileChipName.textContent = file.name;
  fileChip.classList.add('show');
  try{
    const ext = file.name.split('.').pop().toLowerCase();
    let text = '';
    if(ext === 'docx'){
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.extractRawText({arrayBuffer});
      text = result.value;
    } else if(ext === 'pdf'){
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data: arrayBuffer}).promise;
      let pages = [];
      for(let i=1;i<=pdf.numPages;i++){
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        pages.push(content.items.map(it => it.str).join(''));
      }
      text = pages.join('\n');
    } else if(ext === 'txt'){
      text = await file.text();
    } else {
      statusText.textContent = '対応していない形式です';
      return;
    }
    textInput.value = text.trim();
    updateWordCount();
    statusText.textContent = '読み込み完了。再生できます';
  }catch(err){
    console.error(err);
    statusText.textContent = '読み込みに失敗しました';
  }
}

// ---------- Voices ----------
// Heuristic: prefer voices that sound more natural (often labeled
// "Enhanced", "Premium", "Neural", or are Google/Apple high-quality voices)
// over the default robotic compact voices.
function qualityScore(v){
  const name = v.name.toLowerCase();
  let score = 0;
  if(name.includes('enhanced') || name.includes('premium') || name.includes('neural')) score += 5;
  if(name.includes('google')) score += 3;
  if(name.includes('siri')) score += 3;
  if(!v.localService) score += 1; // network voices are often higher quality
  if(name.includes('compact')) score -= 3;
  return score;
}

function loadVoices(){
  voices = speechSynthesis.getVoices();
  const jaVoices = voices.filter(v => v.lang.startsWith('ja'));
  const list = (jaVoices.length ? jaVoices : voices).slice().sort((a,b) => qualityScore(b) - qualityScore(a));
  voiceSelect.innerHTML = '';
  list.forEach((v) => {
    const opt = document.createElement('option');
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    voiceSelect.appendChild(opt);
  });
  const saved = localStorage.getItem('looprise-voice');
  if(saved && list.some(v => v.name === saved)){
    voiceSelect.value = saved;
  }
  updateVoiceHint(list);
}

function updateVoiceHint(list){
  if(!list.length){
    voiceHint.textContent = '';
    return;
  }
  const top = list[0];
  const isHighQuality = qualityScore(top) >= 3;
  voiceHint.innerHTML = isHighQuality
    ? `<span class="tag">●</span> この端末の高品質な音声を自動選択しました`
    : `この端末では標準音声のみ利用できます。設定アプリで音声を追加すると、より自然になる場合があります`;
}

voiceSelect.addEventListener('change', () => {
  localStorage.setItem('looprise-voice', voiceSelect.value);
});

loadVoices();
if(speechSynthesis.onvoiceschanged !== undefined){
  speechSynthesis.onvoiceschanged = loadVoices;
}

previewBtn.addEventListener('click', () => {
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance('こんにちは。ループライズ・リーダーです。この声で読み上げます。');
  const selected = voices.find(v => v.name === voiceSelect.value);
  if(selected) utter.voice = selected;
  utter.rate = parseFloat(rateSlider.value);
  speechSynthesis.speak(utter);
});

// ---------- Rate slider ----------
rateSlider.addEventListener('input', () => {
  const val = parseFloat(rateSlider.value);
  rateVal.textContent = val.toFixed(1) + '×';
  const pct = ((val - 0.5) / 1.5) * 100;
  rateSlider.style.setProperty('--fill', pct + '%');
});

// ---------- Sentence splitting ----------
function splitSentences(text){
  return text
    .replace(/\r\n/g, '\n')
    .split(/(?<=[。！？\n])/)
    .map(s => s.trim())
    .filter(s => s.length > 0);
}

function updateProgressUI(){
  const total = sentences.length || 1;
  const pct = currentIndex / total;
  dialProgress.style.strokeDasharray = CIRC;
  dialProgress.style.strokeDashoffset = CIRC * (1 - pct);
  progressFill.style.width = (pct*100) + '%';
  progressText.textContent = `${currentIndex} / ${sentences.length}`;
}

function setPlayingUI(playing){
  isPlaying = playing;
  if(playing){
    playIcon.innerHTML = '<path d="M7 5h3v14H7zM14 5h3v14h-3z" fill="#ffb84d"/>';
    statusText.textContent = '読み上げ中…';
    statusText.classList.add('live');
  } else {
    playIcon.innerHTML = '<path d="M8 5v14l11-7L8 5z" fill="#ffb84d"/>';
    statusText.classList.remove('live');
    statusText.textContent = sentences.length ? '一時停止中' : '資料を読み込んでください';
  }
}

function speakFrom(index){
  speechSynthesis.cancel();
  if(index >= sentences.length){
    setPlayingUI(false);
    statusText.textContent = '読み上げ完了';
    currentIndex = 0;
    updateProgressUI();
    return;
  }
  currentIndex = index;
  updateProgressUI();
  const utter = new SpeechSynthesisUtterance(sentences[index]);
  const selected = voices.find(v => v.name === voiceSelect.value);
  if(selected) utter.voice = selected;
  utter.lang = selected ? selected.lang : 'ja-JP';
  utter.rate = parseFloat(rateSlider.value);
  utter.onend = () => {
    if(isPlaying) speakFrom(index + 1);
  };
  speechSynthesis.speak(utter);
}

function play(){
  if(!sentences.length){
    sentences = splitSentences(textInput.value);
    currentIndex = 0;
  }
  if(!sentences.length){
    statusText.textContent = '読み上げる文章がありません';
    return;
  }
  setPlayingUI(true);
  speakFrom(currentIndex);
}

function pause(){
  speechSynthesis.cancel();
  setPlayingUI(false);
}

function stop(){
  speechSynthesis.cancel();
  setPlayingUI(false);
  currentIndex = 0;
  sentences = [];
  updateProgressUI();
  statusText.textContent = '停止しました';
}

dialBtn.addEventListener('click', () => {
  if(isPlaying){ pause(); } else { play(); }
});
dialBtn.addEventListener('keydown', e => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); dialBtn.click(); }
});

stopBtn.addEventListener('click', stop);

backBtn.addEventListener('click', () => {
  if(!sentences.length) return;
  const newIndex = Math.max(0, currentIndex - 3);
  if(isPlaying){ speakFrom(newIndex); } else { currentIndex = newIndex; updateProgressUI(); }
});
fwdBtn.addEventListener('click', () => {
  if(!sentences.length) return;
  const newIndex = Math.min(sentences.length - 1, currentIndex + 3);
  if(isPlaying){ speakFrom(newIndex); } else { currentIndex = newIndex; updateProgressUI(); }
});

// Reset sentence cache when text changes manually
textInput.addEventListener('input', () => {
  if(!isPlaying){
    sentences = [];
    currentIndex = 0;
    updateProgressUI();
  }
// ---------- PWA install ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.classList.add('show');
});
installBtn.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBanner.classList.remove('show');
});
window.addEventListener('appinstalled', () => {
  installBanner.classList.remove('show');
});

// ---------- Service worker ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(err => {
      console.warn('Service worker registration failed:', err);
    });
  });
